name: FAST4TIRF
version: 1.0.0
schema: v1

# --- Step 1: convert Supervisely labels -> image/mask PNGs (convert.sh) ---
# Supervisely project folder(s) containing meta.json, paired by position with converted-dir; dataset names must be unique across projects.
project-dir:
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\labeled_Cd8AA            # old batch (Apr 2026)
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\Control_Negative
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\labeled_CD8A_GFP
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\labeled_CD8A_ABS
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\labeled_CD8A_Trunc_GFP
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\labeled_CD8A_Trunc_ABS
# Output folder(s) written by convert.sh, one <dataset>\{images,masks,preview} per Supervisely dataset.
converted-dir:
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\converted_labeled_Cd8AA
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\converted_labeled_Control_Negative
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\converted_labeled_CD8A_GFP
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\converted_labeled_CD8A_ABS
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\converted_labeled_CD8A_Trunc_GFP
  - F:\Cailab\Cai students\Amy\Thesis_AJ\Images\converted_labeled_CD8A_Trunc_ABS

# Supervisely class name -> mask pixel value (background 0 is implicit; "_1" duplicates resolve automatically).
class-name-to-index:
  F-actin: 1          # microvilli
  Lamellipodia: 2     # cell body
  Focal Adhesion: 3   # bright, intense region in the cell body

# Supervisely classes to skip during conversion.
ignored-classes: []

# Overlap priority: the last class listed is painted on top.
paint-order: [Lamellipodia, F-actin, Focal Adhesion]

# RGB color per class, used only for preview overlays.
colormap:
  0: [0, 0, 0]        # Background
  1: [0, 255, 0]      # F-actin (microvilli)
  2: [255, 255, 0]    # Lamellipodia (cell body)
  3: [255, 0, 0]      # Focal Adhesion

preview: true
preview-alpha: 0.4

# --- Step 2: train and test (run_train.sh) ---
# Test set = every Supervisely dataset whose name ends in _Test (e.g. CD8A_GFP_Test).

# Starting checkpoint (omit to train from the ImageNet encoder only).
pretrained-weights: F:\Cailab\Cai students\Amy\Thesis_AJ\fast_model.pth
epochs: 50
out-dir: F:\Cailab\Cai students\Amy\Thesis_AJ\final_model
batch-size: 2
classes: 4               # background + F-actin + Lamellipodia + Focal Adhesion
lr: null                 # null = 1e-4 with pretrained weights, else 1e-3
seed: 42
# Folds are stratified by `groups`; check them with `run_train.sh config.yaml --dry-run`.
k-folds: 5

# clDice loss (Shit et al., 2021) for connectivity of thin structures, applied to F-actin only.
cldice-weight: 0.3        # loss = (1 - w) * dice + w * cldice
cldice-classes: [F-actin]
cldice-skel-iters: 10     # soft-skeleton iterations

# --- Step 3: quantification (quantification.py) ---
# Group from the filename: the first group whose pattern is in the name wins (order = plot order).
groups:
  Control: [Control]
  CD8A_GFP: [CD8A_GFP]
  CD8A_ABS: [CD8A_ABS]
  CD8A_Trunc_GFP: [CD8A_Trunc_GFP]
  CD8A_Trunc_ABS: [CD8A_Trunc_ABS]
  CD8AA_old: [CD8AA]        # old batch: training only, not for the group comparison

# Groups whose microvilli density is compared statistically (all groups are still validated).
compare-groups: [Control, CD8A_GFP, CD8A_ABS, CD8A_Trunc_GFP, CD8A_Trunc_ABS]

# Minimum microvilli object area (px^2) to be counted for density.
count-min-area:
  microvilli: 0

# Union of classes reported as one structure, counted by connected components of the union.
merged-classes:
  microvilli: [F-actin, Focal Adhesion]

# A class wins a pixel only if its probability also clears this threshold (tuned with sweep_threshold.py).
class-thresholds:


# Where a thresholded-out pixel goes: "next_best" class or "background".
threshold-fallback: next_best
